services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lab-net
    group_add:
      - "115"

volumes:
  jenkins_home:

networks:
  lab-net:
    name: lab-net
